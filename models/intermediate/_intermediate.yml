version: 2

models:
  - name: int_orders_deduped
    description: stg_orders with exact order_id duplicates collapsed to one row.
    columns:
      - name: order_id
        data_tests: [not_null, unique]

  - name: int_orders_quarantine
    description: Deduped orders whose customer_id has no matching customer, with why.
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: quarantine_reason
        data_tests: [not_null]

  - name: int_orders_valid
    description: Deduped orders that passed every check - what the gold layer builds on.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: int_order_items_quarantine
    description: Order items rejected for a non-positive quantity or an unknown product_id.
    columns:
      - name: order_item_id
        data_tests: [not_null]
      - name: quarantine_reason
        data_tests: [not_null]

  - name: int_order_items_valid
    description: Order items that passed every check.
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: quantity
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 1
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
